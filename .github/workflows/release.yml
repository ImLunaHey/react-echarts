name: Release

on:
  push:
    branches:
      - main

# `actions: write` is needed so the post-release step can dispatch
# `publish.yml` via the workflow_dispatch API. `contents: write` and
# `pull-requests: write` are for release-please's PR/tag operations.
permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          release-type: node

      # Publishing happens in `publish.yml` (npm's trusted-publishing
      # is wired to that workflow file only — see the npm package's
      # trusted-publisher configuration). Tags pushed by release-
      # please via the default GITHUB_TOKEN don't trigger downstream
      # workflows, so we dispatch `publish.yml` explicitly once a
      # release has actually been created.
      - name: Trigger publish workflow
        if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run publish.yml --ref main
