name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      # NOTE: no `registry-url` here. `actions/setup-node` writes an
      # `.npmrc` with `_authToken=${NODE_AUTH_TOKEN}` whenever it's
      # given a registry-url. Under trusted publishing there's no
      # NODE_AUTH_TOKEN, so the placeholder ends up as the literal
      # auth value, npm treats the request as anonymous, and the
      # registry returns 404 instead of triggering the OIDC handshake.
      # Letting the npm CLI manage auth itself is the supported path.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Trusted Publishing needs npm >= 11.5.1 to perform the OIDC
      # handshake. Node 22 ships with npm 10.x which silently falls
      # back to anonymous auth → 404 on PUT. Bump explicitly.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      - name: Build
        run: pnpm build

      # `npm publish` (npm 11+) auto-detects GHA, calls the OIDC
      # endpoint, exchanges the token for a short-lived publish token,
      # and attaches provenance metadata. No NODE_AUTH_TOKEN required.
      - name: Publish to npm
        run: npm publish --provenance --access public

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com/

      - name: Publish to GitHub Packages
        run: pnpm publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
